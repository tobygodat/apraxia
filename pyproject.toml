[project]
name = "tobios"
version = "0.1.0"
description = "Self-hosted personal CRM: scans Obsidian daily notes, extracts items to SQLite, surfaces them in a web app, and drafts proposals over Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21.0",
    "anthropic>=0.40",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.1",
]

[project.scripts]
tobios = "tobios.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tobios"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tobios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
